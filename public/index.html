<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：これが無いと env(safe-area-inset-*) が常に 0 を返し、
       standalone（ホーム画面から起動）で FAB や下部固定パネルがホームインジケータに潜り込む。
       避ける実装は public/css/object/utility/_safe-area.css（u-fab-safe / u-pb-safe）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Event Planner - イベント作りをサポート</title>

  <!-- ===== PWA（Web Push は iOS ではホーム画面追加が必須条件）===== -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="イベクリ">
  <link rel="apple-touch-icon" href="/images/icon/app-icon-192.png">
  <meta name="theme-color" content="#0CA1E3">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- ミッションチャットのリアクション用絵文字ピッカー（読めない場合は固定セットにフォールバック） -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
  <!-- スタイルは FLOCSS で public/css/ に分割してある。詳細は public/css/README.md -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen">

  <!-- ローディング画面 -->
  <div id="loading-screen" class="l-loading">
    <div class="text-center">
      <div class="w-16 h-16 border-4 border-[#0CA1E3] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-[#A7AAAC] font-bold text-sm">読み込み中...</p>
    </div>
  </div>

  <div id="app" class="l-app max-w-md mx-auto min-h-screen relative flex flex-col"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
