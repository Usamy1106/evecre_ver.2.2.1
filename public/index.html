<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：これが無いと env(safe-area-inset-*) が常に 0 を返し、
       standalone（ホーム画面から起動）で FAB や下部固定パネルがホームインジケータに潜り込む。
       避ける実装は public/css/object/utility/_safe-area.css（u-fab-safe / u-pb-safe）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex" />

  <title>イベクリ - イベントづくりを楽しく</title>

  <!-- ===== PWA（Web Push は iOS ではホーム画面追加が必須条件）===== -->
  <link rel="manifest" href="/manifest.json">
  <!-- ★2つとも要る。iOS は apple- 付きしか見ず、これが無いとホーム画面から起動しても
       フルスクリーン（standalone）にならない＝通知の前提が崩れる。
       Chrome は標準名の mobile-web-app-capable を見る（apple- 付きだけだと
       「deprecated」の警告が出る）。どちらも消さないこと。 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="イベクリ">
  <!-- ===== アイコン（元絵は images/icon/evecre-icon-1024.png。全サイズ scripts/genIcons.mjs で生成）=====
       ★手で1枚ずつ書き出さないこと。元絵を差し替えたらスクリプトを流す。 -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="16x16"   href="/images/icon/evecre-icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32"   href="/images/icon/evecre-icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icon/evecre-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/icon/evecre-icon-180.png">
  <meta name="theme-color" content="#209DDB">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- ★絵文字ピッカー（emoji-picker-element）はここで読まない（2026-09-20）。
       使うのは views/missionDetail.js の openChatEmojiPicker だけなのに、
       ページを開くたびに jsDelivr へ往復していた（リアクションを一度も開かない人にも）。
       「ピッカーを開くときに読む」形へ移した。読めない場合は固定の絵文字グリッドに落ちる。 -->
  <!-- ===== Web フォント（山頂の看板でのみ使う）=====
       ★用途を限っている。本文には使わないこと（読み込みが重く、日本語は特に大きい）。
         Yuji Syuku … 看板のタイトル（筆文字）
         Noto Serif Georgian … 標高の数字（欧文数字だけなので軽い）
       ★display=swap。読めなくても代替フォントで表示だけは出る（看板が空にならない）。
       ★2026-09-20: 描画ブロックから外した。
         この <link> は同期読み込みで、初回描画の前に fonts.googleapis.com への
         DNS + TLS + 往復が入っていた。ところが使い先は _mountain.css の
         .p-mountain__summit-title / __summit-alt の2箇所だけで、山頂の看板は
         開催最終日を過ぎたイベントにしか出ない（mountainPath.js の _isSummit）。
         ほぼ全員が、自分には出ない要素のために往復を1回払っていた。
       ★media="print" → onload で all に戻す形。ブラウザは print 用のスタイルシートを
         描画の待ち対象にしないので、取得は走るが描画は待たない。
         onload は1回だけ発火するので this.onload=null で自分を外す。
       ★<noscript> のフォールバックを必ず残すこと。JS が無効だと onload が走らず、
         看板のフォントが永久に当たらない。
       ★preconnect の2行は残すこと（この形ではむしろ効く）。
       ★URL は1文字も変えないこと（family の順序・display=swap を含む。
         変えると Google 側のキャッシュキーが変わる）。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.onload=null;this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Serif+Georgian:wght@700&display=swap">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Serif+Georgian:wght@700&display=swap">
  </noscript>

  <!-- スタイルは FLOCSS で public/css/ に分割してある。詳細は public/css/README.md
       ★Tailwind の CDN は 2026-08-18 に撤去した。ブラウザ既定の打ち消し（Preflight
         相当）は public/css/foundation/_reset.css が担っている。戻さないこと。 -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ローディング画面 -->
  <div id="loading-screen" class="l-loading">
    <div class="l-loading__inner">
      <div class="c-spinner c-spinner--lg l-loading__spinner"></div>
      <p class="l-loading__text">読み込み中...</p>
    </div>
  </div>

  <div id="app" class="l-app"></div>

  <!-- Lottie 再生ライブラリ。★自ドメインから配信する（CDN を使わないこと）。
       LottieFiles や jsDelivr のホスティング枠・無料プランにアプリの動作を
       左右されないようにするため。実体は public/js/vendor/lottie-web/。
       ★UMD ビルドなので type="module" は付けない（window.lottie に入る）。
       ★main.js より前に置くこと。モーダルが window.lottie を同期的に見る。 -->
  <!-- ★defer を付けている（2026-09-20）。165KB のクラシックスクリプトがこの位置で
       HTML のパースを止めていた。defer にしてもモジュールスクリプト（main.js）との
       実行順はドキュメント順のまま保たれるので、main.js より先に window.lottie が入る。
       ★CDN に戻さないこと／type="module" を付けないこと（UMD ビルド）。 -->
  <!-- ★パスにバージョンを入れてある（/js/vendor/<名前>/<バージョン>/）。server.js が
       /js/vendor/ 配下だけを immutable で配信するので、2回目以降は確認の通信ごと消える。
       ★更新するときは必ずパスのバージョンを変えること。同じパスのまま中身を差し替えると、
       古いものが配信され続ける（images/bg と同じ約束）。 -->
  <script defer src="/js/vendor/lottie-web/5.13.0/lottie_light.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
